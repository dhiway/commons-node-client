# The transport graph every consumer must build against.
#
# Cargo applies [patch.crates-io] only at the root of a workspace, so each
# consumer of these crates repeats the block. This file is the canonical
# record of it. `scripts/check-transport-pins.py <Cargo.lock>` asserts that a
# consumer's resolved graph carries exactly these revisions, so a drifted fork
# fails that consumer's gate instead of producing a different transport.
#
# A change here is a change to the transport for every consumer: land it with
# the crate changes that need it, bump the consumers' client pin in the same
# review round, and re-run their gates.


name: Bug
description: Something works wrongly.
type: Bug
projects: ["dhiway/15"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a clean start.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened. Paste the exact error text.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: Version or commit, and the platform (macOS, Windows, Linux, browser).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots or a recording.

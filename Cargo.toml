[workspace]
resolver = "2"
members = ["crates/auth-wire", "crates/client"]

[workspace.package]
# Continues the node's numbering: the crates were moved from commons-node
# 7b4694e (whose workspace version is 0.9.47; the content is that of the
# 0.9.48 release commit a142270, which did not change either crate). From here
# the two crate versions move on their own; consumers pin this repository by
# revision.
version = "0.9.48"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/dhiway/commons-node-client"

[workspace.dependencies]
anyhow = "1.0"
auth-wire = { path = "crates/auth-wire" }
blake3 = "1.8.7"
chacha20poly1305 = "0.11"
# The Commons network profile (spec node-access 8.1), at the revision the node
# pins. `native-client` is the profile's own feature set and keeps the relay
# server out; a consumer builds its endpoint from it and never re-declares the
# relays, allowlist, resolver or signed lookups.
endpoint = { git = "https://github.com/dhiway/commons-services", rev = "bf6c2ccaf4837575e2d6648526eaa822523b84c7", default-features = false, features = ["native-client"] }
hex = "0.4.3"
iroh = { version = "1.5", features = ["default"] }
origin-protocol = { git = "https://github.com/dhiway/origin-protocol", rev = "5508eb19f905bf198e4d2602793d853487a7b375" }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt", "sync", "time", "net", "rt-multi-thread", "process", "signal"] }
x25519-dalek = "2.0.1"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }

[profile.dev.package]
blake3 = { opt-level = 3 }
zeroize = { opt-level = 3 }

# Reviewed native transport policy and Retry repair; one graph for all consumers.
# This table is the canonical copy: transport-pins.toml holds the same pins, and
# scripts/check-transport-pins.py fails a consumer whose root table has drifted.
[patch.crates-io]
iroh-blobs = { git = "https://github.com/dhiway/iroh-blobs", rev = "39ec1d2a226c2e6682756e498276b989cf6269d1" }
iroh = { git = "https://github.com/dhiway/iroh", rev = "53eeba9b1da316c8e6f7d1366ebcbf338f18c9e0" }
iroh-base = { git = "https://github.com/dhiway/iroh", rev = "53eeba9b1da316c8e6f7d1366ebcbf338f18c9e0" }
iroh-dns = { git = "https://github.com/dhiway/iroh", rev = "53eeba9b1da316c8e6f7d1366ebcbf338f18c9e0" }
iroh-relay = { git = "https://github.com/dhiway/iroh", rev = "53eeba9b1da316c8e6f7d1366ebcbf338f18c9e0" }
noq = { git = "https://github.com/dhiway/noq", rev = "a651c1353017ab6643ea65880ce390fcd2df547d" }
noq-proto = { git = "https://github.com/dhiway/noq", rev = "a651c1353017ab6643ea65880ce390fcd2df547d" }
noq-udp = { git = "https://github.com/dhiway/noq", rev = "a651c1353017ab6643ea65880ce390fcd2df547d" }
